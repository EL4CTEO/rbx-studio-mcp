name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The Luau toolchain is not on the runner. Without it `check:plugin` exits 1
      # and plugin syntax errors would reach Studio instead of the build.
      - name: Fetch Luau
        run: |
          curl -sSfL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          mkdir -p tools && unzip -o -q luau.zip -d tools
          chmod +x tools/luau tools/luau-compile tools/luau-analyze
      - run: node scripts/check-plugin.mjs
      - run: node scripts/test-plugin.mjs
      - run: node scripts/test-transport.mjs
      - run: node scripts/build-plugin.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: StudioMCP.rbxmx
          path: build/StudioMCP.rbxmx

  server:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      # rust-toolchain.toml pins 1.99.1; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      # Not `npm ci`: the lock names the platform packages, which only exist on
      # npm after a release. The tests need just the MCP SDK.
      - run: npm install --no-package-lock --omit=optional --ignore-scripts
        working-directory: .
      - run: node scripts/test-native.mjs
        working-directory: .
