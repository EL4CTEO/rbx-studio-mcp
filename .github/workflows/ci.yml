name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One leg failing says nothing about the other, and which of the two fails
      # is the useful part of the answer.
      fail-fast: false
      matrix:
        # The oldest Node `engines` allows, and the current LTS: what is promised
        # and what people actually run.
        node: ["22.15", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build the server
        run: npm run build

      # The Luau toolchain is not on the runner and is not an npm package, so it
      # is fetched here. Without it `check:plugin` exits 1 and every plugin
      # syntax error reaches Studio instead of the build -- which is the whole
      # reason that check exists.
      - name: Fetch Luau
        run: |
          # The permanent "latest" redirect, not the API: an unauthenticated
          # api.github.com call is rate limited per runner IP, and when it is
          # refused the version comes back empty and the download 404s.
          curl -sSfL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          mkdir -p tools && unzip -o -q luau.zip -d tools
          chmod +x tools/luau tools/luau-compile tools/luau-analyze

      - name: Compile every plugin source file
        run: npm run check:plugin

      - name: Luau unit tests
        run: npm test

      - name: Pack the plugin
        run: npm run build:plugin

      # Once, from the minimum-Node leg: the artifact name has to be unique, and
      # the plugin is the same file whichever Node packed it.
      - uses: actions/upload-artifact@v7
        if: matrix.node == '22.15'
        with:
          name: StudioMCP.rbxmx
          path: build/StudioMCP.rbxmx
