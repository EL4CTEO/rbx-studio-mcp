<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="rbx-studio-mcp">
  <title>rbx-studio-mcp</title>
  <desc>A wireframe prism splitting one beam into the console's signal colours.</desc>

  <defs>
    <!-- The panel's own background, so the mark and the plugin look like the
         same product rather than two designs that happen to ship together. -->
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12131F"/>
      <stop offset="1" stop-color="#0B0C14"/>
    </linearGradient>

    <!-- Edges are lit rather than flat: brighter at the near corner, falling
         off toward the far one, which is what makes a flat wireframe read as a
         solid at this size. -->
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7C6BD0"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>

    <linearGradient id="face" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.05"/>
    </linearGradient>

    <!-- The incoming beam fades in from nothing: a line that simply starts at
         the canvas edge reads as a cropped rectangle, not as light arriving. -->
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CED4E2" stop-opacity="0"/>
      <stop offset="1" stop-color="#E8ECF5" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softbloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="160" rx="18" fill="url(#panel)"/>

  <!-- One beam in. -->
  <path d="M18 76 L92 81" stroke="url(#beam)" stroke-width="2.4" stroke-linecap="round" filter="url(#softbloom)"/>

  <!-- Five out, in the console's own level colours: read, ok, warn, write,
       error. The mark says what the plugin does - one command in, a spread of
       distinguishable signals back. -->
  <g filter="url(#bloom)" stroke-width="2.2" stroke-linecap="round" opacity="0.95">
    <path d="M140 84 L258 44" stroke="#67E8F9"/>
    <path d="M140 84 L258 63" stroke="#6EE7A8"/>
    <path d="M140 84 L258 82" stroke="#FBBF24"/>
    <path d="M140 84 L258 101" stroke="#A78BFA"/>
    <path d="M140 84 L258 120" stroke="#FB7185"/>
  </g>

  <!-- The prism: a triangular solid at three-quarter view. Far edges are drawn
       first and dimmer, so the near triangle sits in front of them. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 94 L156 94 L128 40 Z" stroke="url(#edge)" stroke-width="1.5" opacity="0.38"/>
    <path d="M78 108 L100 94 M134 108 L156 94 M106 54 L128 40"
          stroke="url(#edge)" stroke-width="1.5" opacity="0.5"/>
    <path d="M78 108 L134 108 L106 54 Z" fill="url(#face)" stroke="url(#edge)" stroke-width="2.4"/>
  </g>

  <!-- Lit vertices. A wireframe reads as flat when every stroke weighs the
       same; the corners are what give the eye something to hold. -->
  <g fill="#E9E4FF" filter="url(#softbloom)">
    <circle cx="78" cy="108" r="3.1"/>
    <circle cx="134" cy="108" r="3.1"/>
    <circle cx="106" cy="54" r="3.1"/>
  </g>
  <g fill="#A78BFA" opacity="0.55">
    <circle cx="100" cy="94" r="2"/>
    <circle cx="156" cy="94" r="2"/>
    <circle cx="128" cy="40" r="2"/>
  </g>

  <!-- Wordmark. Monospace because everything this tool prints is monospace,
       and "mcp" carries the accent so the name has somewhere for the eye to
       land at favicon size. -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="292" y="90" font-size="38" font-weight="600" letter-spacing="-1.2" fill="#DCE2EE">rbx-studio-<tspan fill="#A78BFA">mcp</tspan></text>
    <text x="294" y="114" font-size="11" letter-spacing="3.4" fill="#5A6178">MODEL CONTEXT PROTOCOL FOR ROBLOX STUDIO</text>
  </g>
</svg>
